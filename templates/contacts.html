<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интернет-магазин - Контакты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Мой Магазин</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Главная</a>
                <a class="nav-link" href="/contacts/">Контакты</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
    <h1>Наши контакты</h1>
    <p>Свяжитесь с нами по телефону: +7 (999) 123-45-67</p>
    <p>Или напишите нам на почту: info@myshop.ru</p>

    <hr class="my-4">

    <!-- Блок для отображения сообщения об успехе -->
    {% if success %}
        <div class="alert alert-success" role="alert">
            Спасибо, <strong>{{ sender_name }}</strong>! Ваше сообщение успешно отправлено.
        </div>
    {% endif %}

    <!-- Сама форма обратной связи -->
    <h3>Напишите нам</h3>
    <form method="post" action="">
        <!-- Обязательный токен безопасности Django -->
        {% csrf_token %}

        <div class="mb-3">
            <label for="name" class="form-label">Ваше имя</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Ваше сообщение</label>
            <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Отправить</button>
    </form>
</div>
</body>
</html>
